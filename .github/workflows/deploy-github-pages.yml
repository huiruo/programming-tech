name: Deploy to huiruo.github.io

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static site
        run: pnpm build

      - name: Check out the publishing repository
        uses: actions/checkout@v4
        with:
          repository: huiruo/huiruo.github.io
          token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          path: publish

      - name: Publish static files
        run: |
          rsync --archive --delete --exclude .git out/ publish/
          cd publish
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --quiet || git commit -m "deploy: update site"
          git push
